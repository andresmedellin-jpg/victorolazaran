<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elysium · Mi día · se mudó a la Plataforma</title>
<meta http-equiv="refresh" content="4; url=https://app.medco.mx/#/personal">
<meta name="robots" content="noindex">
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#0f172a;--text2:#475569;--primary:#1f4e79}
@media (prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111a2e;--text:#e2e8f0;--text2:#a3b1c6;--primary:#5b9bd5}}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:16px}
.card{background:var(--card);border-radius:16px;padding:32px 28px;max-width:420px;width:100%;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
h1{font-size:20px;margin-bottom:10px}
p{color:var(--text2);line-height:1.5;font-size:15px;margin-bottom:22px}
a.btn{display:inline-block;background:var(--primary);color:#fff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:10px}
small{display:block;margin-top:16px;color:var(--text2);font-size:13px}
</style>
</head>
<body>
<main class="card">
<h1>Elysium · Mi día ya está en la Plataforma</h1>
<p>Esta página ya no se usa. Todo lo que capturabas aquí ahora está en la Plataforma de Treme · MEDCO, con tu usuario y contraseña.</p>
<a class="btn" href="https://app.medco.mx/#/personal">Ir a la Plataforma</a>
<small>Te llevamos en unos segundos. Si no tienes usuario, pídeselo a Andrés.</small>
</main>
</body>
</html>
