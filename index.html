<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Elysium — Mi día</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#fff;--bg2:#fafafa;--bg3:#f5f5f5;
  --border:#efefef;--border2:#e4e4e4;
  --text:#0a0a0a;--text2:#525252;--text3:#a3a3a3;
  --green:#16a34a;--green-bg:#f0fdf4;
  --red:#dc2626;--red-bg:#fff1f1;
  --amber:#d97706;--amber-bg:#fffbeb;
  --blue:#2563eb;--blue-bg:#eff6ff;
}
body{font-family:'Inter',system-ui,sans-serif;background:#fff;color:var(--text);min-height:100vh}
.mhdr{height:52px;padding:0 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#fff;z-index:300}
.mhdr-logo{font-size:14px;font-weight:900;letter-spacing:-.04em;text-transform:uppercase}
.mhdr-sep{width:1px;height:14px;background:var(--border2)}
.mhdr-sub{font-size:11px;font-weight:500;color:var(--text3);letter-spacing:.02em}
.main-tabs{height:44px;padding:0 20px;display:flex;align-items:flex-end;border-bottom:1px solid var(--border);background:#fff;gap:0;position:sticky;top:52px;z-index:290}
.mtab{flex:1;text-align:center;padding:0 8px 10px;font-size:12px;font-weight:700;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .12s;letter-spacing:.02em;text-transform:uppercase}
.mtab.active{color:var(--text);border-bottom-color:var(--text)}
.section{display:none}.section.active{display:block}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 70px}
.hsel,.hinp{padding:8px 10px;border:1px solid var(--border2);border-radius:6px;font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--text);background:#fff;outline:none;cursor:pointer;width:100%}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.topbar-sp{flex:1}
.card{border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px;background:#fff}
.card-hdr{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.av{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;background:var(--bg3);color:var(--text2)}
.card-hdr-name{font-size:13px;font-weight:700}
.card-hdr-sub{font-size:11px;color:var(--text3);margin-top:1px}
.card-hdr-sp{flex:1}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.badge-ok{background:var(--green-bg);color:var(--green)}
.badge-mid{background:var(--amber-bg);color:var(--amber)}
.badge-bad{background:var(--red-bg);color:var(--red)}
.task-row{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.task-row:last-child{border-bottom:none}
.task-name{flex:1;font-size:13px;font-weight:500;min-width:140px}
.task-name.done{color:var(--text3);text-decoration:line-through}
.task-meta{font-size:10px;color:var(--text3);margin-top:2px}
.tbtn{border:1.5px solid var(--border2);background:#fff;border-radius:6px;font-family:'Inter',sans-serif;font-weight:700;font-size:11px;cursor:pointer;padding:7px 11px;transition:all .12s;white-space:nowrap}
.tbtn.done{background:var(--green);border-color:var(--green);color:#fff}
.tbtn.no{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.tbtn-photo{width:34px;height:34px;padding:0;display:flex;align-items:center;justify-content:center;font-size:15px;border-radius:6px}
.tbtn-photo.has{background:var(--blue-bg);border-color:var(--blue);color:var(--blue)}
.empty{text-align:center;padding:32px;color:var(--text3);font-size:12px;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;border:none;font-family:'Inter',sans-serif;font-size:13px;font-weight:700;cursor:pointer}
.btn-primary{background:var(--text);color:#fff}
.btn-ghost{background:var(--bg3);color:var(--text2)}
.btn-full{width:100%;justify-content:center}
.addrow{padding:10px 16px;border-top:1px dashed var(--border2)}
.addrow a{font-size:12px;font-weight:700;color:var(--text2);cursor:pointer;text-decoration:none}
.inc-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:10px;background:#fff}
.inc-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px}
.inc-title{font-size:13px;font-weight:700;flex:1}
.inc-meta{font-size:11px;color:var(--text3);margin-top:3px}
.inc-notes{font-size:12px;color:var(--text2);margin-top:6px;line-height:1.5}
.sevdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.sevdot.leve{background:var(--amber)}.sevdot.grave{background:var(--red)}
.mover{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center;z-index:900}
.mbox{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.mhead-title{font-size:14px;font-weight:800}
.mclose{border:none;background:none;font-size:20px;cursor:pointer;color:var(--text3);padding:4px}
.mbody{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.mfoot{padding:14px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--border);display:flex;gap:8px}
.mfoot .btn{flex:1}
.field{display:flex;flex-direction:column;gap:5px}
.lbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em}
.inp,select.inp,textarea.inp{padding:11px 12px;border:1.5px solid var(--border2);border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;color:var(--text);outline:none;width:100%;background:#fff}
textarea.inp{resize:vertical;min-height:64px}
img.thumb{max-width:160px;border-radius:8px;display:block;margin-top:6px;cursor:zoom-in}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:8px;font-size:12px;font-weight:600;opacity:0;transition:opacity .25s;z-index:9999;white-space:nowrap}
#toast.err{background:var(--red)}
.loading-scr{position:fixed;inset:0;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;color:var(--text3);font-weight:500;z-index:500}
.notewho{font-size:11px;color:var(--text3);padding:0 16px 10px}
</style>
</head>
<body>

<div class="loading-scr" id="loading-scr">Cargando…</div>

<header class="mhdr">
  <div class="mhdr-logo">Treme</div>
  <div class="mhdr-sep"></div>
  <div class="mhdr-sub">Torre Elysium · Mi día</div>
</header>

<nav class="main-tabs">
  <div class="mtab active" id="mtab-asistencia" onclick="switchTab('asistencia')">Asistencia</div>
  <div class="mtab" id="mtab-tareas" onclick="switchTab('tareas')">Tareas</div>

<!-- TAB: ASISTENCIA -->
<div class="section active" id="sec-asistencia">

    <div class="topbar">
      <input class="hinp" type="date" id="a-fecha" onchange="renderAsistencia()" style="width:auto"/>

      <span style="font-size:10px;color:var(--text3)">Toca Entrada/Salida en el momento en que cada quien llegue o se vaya</span>
    </div>
    <div id="asistencia-root"></div>
  </div>
</div>

<!-- TAB: TAREAS -->
<div class="section" id="sec-tareas">
  <div class="wrap">
    <div class="topbar">
      <input class="hinp" type="date" id="t-fecha" onchange="renderTareas()" style="width:auto"/>
      <div class="topbar-sp"></div>
      <span id="t-resumen" style="font-size:11px;color:var(--text3);font-weight:600"></span>
    </div>
    <div id="tareas-root"></div>
  </div>
</div>

<!-- TAB: RONDIN -->
<div class="section" id="sec-rondin">
  <div class="wrap">
    <div class="topbar">
      <input class="hinp" type="date" id="r-fecha" onchange="renderRondin()" style="width:auto"/>
    </div>
    <div id="rondin-quien" style="display:none;margin-bottom:14px">
      <div class="field"><label class="lbl">No identifiqué tu nombre en la nómina — selecciónalo</label>
        <select class="inp" id="r-encargado-sel" onchange="renderRondin()"></select>
      </div>
    </div>
    <div id="rondin-root"></div>
  </div>
</div>

<!-- TAB: INCIDENCIAS -->
<div class="section" id="sec-incidencias">
  <div class="wrap">
    <div class="topbar">
      <select class="hsel" id="i-filtro" onchange="renderIncidencias()" style="width:auto">
        <option value="todas">Todas</option>
        <option value="abiertas" selected>Abiertas</option>
        <option value="resueltas">Resueltas</option>
      </select>
      <div class="topbar-sp"></div>
    </div>
    <button class="btn btn-primary btn-full" style="margin-bottom:16px" onclick="abrirModalIncidencia()">+ Reportar algo</button>
    <div id="incidencias-root"></div>
  </div>
</div>

<!-- MODAL: tarea ad-hoc -->
<div class="mover" id="modal-adhoc" style="display:none">
  <div class="mbox">
    <div class="mhead"><span class="mhead-title">Agregar tarea</span><button class="mclose" onclick="cerrarModal('modal-adhoc')">✕</button></div>
    <div class="mbody">
      <div class="field"><label class="lbl">Empleado</label>
        <select class="inp" id="ah-emp"></select>
      </div>
      <div class="field"><label class="lbl">Tarea</label><input class="inp" id="ah-tarea" placeholder="Ej. Limpiar cristales del lobby"/></div>
      <div class="field"><label class="lbl">Categoría</label>
        <select class="inp" id="ah-cat">
          <option>Limpieza</option><option>Mantenimiento</option><option>Seguridad</option><option>Jardinería</option><option>Administrativo</option><option>Otro</option>
        </select>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn btn-ghost" onclick="cerrarModal('modal-adhoc')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarAdhoc()">Agregar</button>
    </div>
  </div>
</div>

<!-- MODAL: incidencia -->
<div class="mover" id="modal-incidencia" style="display:none">
  <div class="mbox">
    <div class="mhead"><span class="mhead-title">Reportar algo</span><button class="mclose" onclick="cerrarModal('modal-incidencia')">✕</button></div>
    <div class="mbody">
      <div class="field"><label class="lbl">¿Qué pasó?</label><input class="inp" id="inc-titulo" placeholder="Ej. Fuga de agua en el 804"/></div>
      <div class="field"><label class="lbl">Empleado relacionado (si aplica)</label><select class="inp" id="inc-emp"><option value="">— N/A —</option></select></div>
      <div class="field"><label class="lbl">Categoría</label>
        <select class="inp" id="inc-cat">
          <option>Falla de mantenimiento</option><option>Uso indebido de horario</option><option>Trabajo particular en el edificio</option>
          <option>Ausencia / impuntualidad</option><option>Mal servicio</option><option>Otro</option>
        </select>
      </div>
      <div class="field"><label class="lbl">Gravedad</label>
        <select class="inp" id="inc-sev"><option value="leve">Leve</option><option value="grave">Grave</option></select>
      </div>
      <div class="field"><label class="lbl">Notas</label><textarea class="inp" id="inc-notas" placeholder="Detalles..."></textarea></div>
      <div class="field"><label class="lbl">Foto (opcional)</label><input type="file" accept="image/*" capture="environment" id="inc-foto"/></div>
    </div>
    <div class="mfoot">
      <button class="btn btn-ghost" onclick="cerrarModal('modal-incidencia')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarIncidencia()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL: ver foto -->
<div class="mover" id="modal-foto" style="display:none" onclick="cerrarModal('modal-foto')">
  <img id="foto-grande" style="max-width:92vw;max-height:92vh;border-radius:10px;margin:auto"/>
</div>

<div id="toast"></div>

<script>
// ── CONFIG (mismo proyecto Supabase que control_personal_elysium.html) ──
const SB_URL="https://mqzuaxxnidaokhdqcurm.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1xenVheHhuaWRhb2toZHFjdXJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU4Mzg2NDEsImV4cCI6MjA5MTQxNDY0MX0.vHSAuwxc_q-JvmRMkFsaGEPHtjsjqEln3QbREa9B-VU";
const OBRA="Elysium"; // esta vista de campo es solo para Torre Elysium
const NOMBRE_ENCARGADO_BUSCADO="victor"; // se busca sin acentos/mayúsculas dentro de nomina_data

const HDR={'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY};
const sbGet=(t,q='')=>fetch(`${SB_URL}/rest/v1/${t}?${q}`,{headers:{...HDR,'Prefer':'return=representation'}}).then(r=>r.ok?r.json():r.text().then(e=>{throw new Error(e);}));
const sbPost=(t,b)=>fetch(`${SB_URL}/rest/v1/${t}`,{method:'POST',headers:{...HDR,'Prefer':'return=representation'},body:JSON.stringify(b)}).then(r=>r.ok?r.json():r.text().then(e=>{throw new Error(e);}));
const sbPatch=(t,id,b)=>fetch(`${SB_URL}/rest/v1/${t}?id=eq.${id}`,{method:'PATCH',headers:{...HDR,'Prefer':'return=representation'},body:JSON.stringify(b)}).then(r=>r.ok?r.json():r.text().then(e=>{throw new Error(e);}));
const sbDel=(t,id)=>fetch(`${SB_URL}/rest/v1/${t}?id=eq.${id}`,{method:'DELETE',headers:{...HDR,'Prefer':'return=minimal'}}).then(r=>{if(!r.ok)return r.text().then(e=>{throw new Error(e);});});

const DIAS=['DOM','LUN','MAR','MIE','JUE','VIE','SAB'];
const diaCodeDeFecha=f=>DIAS[new Date(f+'T00:00:00').getDay()];
const hoy=()=>new Date().toISOString().slice(0,10);
const norm=s=>(s||'').toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const getInits=n=>(n||'?').split(' ').filter(Boolean).map(p=>p[0]).slice(0,2).join('').toUpperCase();
const fmtHora=iso=>{if(!iso)return'';const d=new Date(iso);return d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});};
const fmtFechaCorta=f=>{if(!f)return'';const d=new Date(f+'T00:00:00');return d.toLocaleDateString('es-MX',{day:'numeric',month:'short'});};

function toast(msg,err=false){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className=err?'err':'';
  t.style.opacity='1';setTimeout(()=>t.style.opacity='0',2800);
}
function cerrarModal(id){document.getElementById(id).style.display='none';}
function abrirModal(id){document.getElementById(id).style.display='flex';}

function compressImage(file,maxDim=900,quality=0.62){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const fr=new FileReader();
    fr.onload=()=>{img.src=fr.result;};
    fr.onerror=reject;
    img.onload=()=>{
      let{width:w,height:h}=img;
      if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;}
      else if(h>=w&&h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;}
      const c=document.createElement('canvas');c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',quality));
    };
    img.onerror=reject;
    fr.readAsDataURL(file);
  });
}
function verFoto(url){document.getElementById('foto-grande').src=url;abrirModal('modal-foto');}

// ── ESTADO GLOBAL ──
let EMPLEADOS=[],PLANTILLA=[],TAREAS=[],RONDINES=[],INCIDENCIAS=[],HORARIOS=[];
let encargadoId=null;

// ── NÓMINA (mismo user_id='admin' que Centro de Control, para que las faltas
// que se marcan aquí aparezcan también en la pestaña Nómina) ──
async function loadNomData(){try{const rows=await sbGet('nomina_data','user_id=eq.admin&select=data');return rows[0]?.data||null;}catch{return null;}}
async function saveNomData(d){try{await fetch(`${SB_URL}/rest/v1/nomina_data`,{method:'POST',headers:{...HDR,'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:'admin',data:d,updated_at:new Date().toISOString()})});}catch(e){console.error(e);}}
function mondayOf(fecha){const d=new Date(fecha+'T00:00:00');const day=d.getDay()||7;d.setDate(d.getDate()-day+1);return d.toISOString().slice(0,10);}
async function syncFaltaNomina(empId,fecha,add){
  const nomData=await loadNomData();
  if(!nomData)return;
  const semana=mondayOf(fecha);
  const asist=nomData.asistencias||[];
  let rec=asist.find(a=>a.empId===empId&&a.semana===semana);
  if(add){
    if(!rec){asist.push({empId,semana,faltas:[fecha]});}
    else if(!rec.faltas.includes(fecha))rec.faltas.push(fecha);
  }else if(rec){
    rec.faltas=rec.faltas.filter(f=>f!==fecha);
  }
  nomData.asistencias=asist;
  await saveNomData(nomData);
}

// ── HORARIOS ──
async function loadHorarios(){
  try{return await sbGet('horario_personal','activo=eq.true&select=*');}
  catch(e){console.error('horario_personal no existe todavía?',e);return[];}
}
function resolveHorario(emp){
  const porEmp=HORARIOS.find(h=>String(h.emp_id)===String(emp.id));
  if(porEmp)return porEmp;
  const porPuesto=HORARIOS.find(h=>!h.emp_id&&norm(h.puesto)===norm(emp.puesto));
  if(porPuesto)return porPuesto;
  return{hora_entrada:'08:00',hora_salida:'17:00',tolerancia_min:10};
}
function horasEntre(hEntrada,hSalida){
  const[h1,m1]=hEntrada.split(':').map(Number);
  const[h2,m2]=hSalida.split(':').map(Number);
  let horas=(h2+m2/60)-(h1+m1/60);
  if(horas<=0)horas+=24;
  return horas||8;
}
function horaHoyDesde(hhmm,fecha){
  const[h,m]=hhmm.split(':').map(Number);
  const d=new Date(fecha+'T00:00:00');
  d.setHours(h,m,0,0);
  return d;
}
async function upsertAsistencia(row){
  return fetch(`${SB_URL}/rest/v1/asistencia_diaria?on_conflict=fecha,emp_id`,{
    method:'POST',headers:{...HDR,'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(row)
  }).then(r=>r.ok?r.json():r.text().then(e=>{throw new Error(e);}));
}

async function loadEmpleados(){
  try{const rows=await sbGet('nomina_data','user_id=eq.admin&select=data');return(rows[0]?.data?.empleados||[]);}
  catch(e){console.error(e);return[];}
}
async function loadPlantilla(){
  try{return await sbGet('plantilla_tareas','select=*&order=puesto.asc');}
  catch(e){console.error(e);return[];}
}
async function loadControlTareas(){
  try{return await sbGet('control_tareas','select=*&order=creado_en.desc&limit=2000');}
  catch(e){console.error(e);return[];}
}
function splitControl(rows){
  TAREAS=rows.filter(r=>r.tipo==='tarea');
  RONDINES=rows.filter(r=>r.tipo==='rondin');
  INCIDENCIAS=rows.filter(r=>r.tipo==='incidencia');
}
function empleadosObra(){return EMPLEADOS.filter(e=>e.obra===OBRA&&e.activo!==false);}
function empMatchPuesto(emp,puestoPlantilla){
  return norm(emp.puesto)===norm(puestoPlantilla)||norm(emp.puesto).includes(norm(puestoPlantilla))||norm(puestoPlantilla).includes(norm(emp.puesto));
}
function planMatchesEmp(p,emp){
  if(p.emp_id)return String(p.emp_id)===String(emp.id);
  return empMatchPuesto(emp,p.puesto);
}
function detectarEncargado(){
  const emps=empleadosObra();
  const porNombre=emps.find(e=>norm(e.nombre).includes(NOMBRE_ENCARGADO_BUSCADO));
  const porPuesto=emps.find(e=>norm(e.puesto).includes('encargado'));
  const sel=porNombre||porPuesto||null;
  const wrap=document.getElementById('rondin-quien');
  const selEl=document.getElementById('r-encargado-sel');
  if(sel){encargadoId=sel.id;wrap.style.display='none';}
  else{
    wrap.style.display='block';
    selEl.innerHTML=emps.map(e=>`<option value="${e.id}">${e.nombre}</option>`).join('');
    encargadoId=selEl.value||null;
  }
}

function switchTab(tab){
  ['asistencia','tareas','rondin','incidencias'].forEach(t=>{
    document.getElementById('mtab-'+t).classList.toggle('active',t===tab);
    document.getElementById('sec-'+t).classList.toggle('active',t===tab);
  });
  if(tab==='asistencia')renderAsistencia();
  if(tab==='tareas')renderTareas();
  if(tab==='rondin')renderRondin();
  if(tab==='incidencias')renderIncidencias();
}

// ══════════════════════════ ASISTENCIA ══════════════════════════
async function renderAsistencia(){
  const fecha=document.getElementById('a-fecha').value||hoy();
  document.getElementById('a-fecha').value=fecha;
  const emps=empleadosObra();
  const root=document.getElementById('asistencia-root');
  if(!emps.length){root.innerHTML='<div class="empty">No hay empleados activos cargados para Elysium en Nómina.</div>';return;}
  root.innerHTML='<div class="empty">Cargando…</div>';
  let rows=[];
  try{rows=await sbGet('asistencia_diaria',`fecha=eq.${fecha}&obra=eq.${OBRA}&select=*`);}
  catch(e){root.innerHTML='<div class="empty">No se pudo cargar asistencia — revisa que ya se haya corrido el SQL de asistencia_diaria en Supabase.</div>';return;}
  const porEmp={};rows.forEach(r=>porEmp[String(r.emp_id)]=r);
  root.innerHTML=emps.map(emp=>{
    const a=porEmp[String(emp.id)];
    const badge=!a?'<span class="badge badge-mid">Sin registrar</span>'
      :a.estado==='falta'?'<span class="badge badge-bad">Falta</span>'
      :a.estado==='permiso'?'<span class="badge badge-mid">Permiso</span>'
      :a.estado==='retardo'?`<span class="badge badge-bad">${a.minutos_tarde||0} min tarde</span>`
      :'<span class="badge badge-ok">A tiempo</span>';
    const sinEntrada=!a||(!a.hora_entrada_real&&a.estado!=='falta'&&a.estado!=='permiso');
    const puedeFaltaPermiso=!a||(a.estado!=='falta'&&a.estado!=='permiso'&&!a.hora_entrada_real);
    return `<div class="card">
      <div class="card-hdr">
        <div class="av">${getInits(emp.nombre)}</div>
        <div><div class="card-hdr-name">${emp.nombre}</div><div class="card-hdr-sub">${emp.puesto||'—'}</div></div>
        <div class="card-hdr-sp"></div>
        ${badge}
      </div>
      <div class="task-row">
        <div style="flex:1;min-width:140px;font-size:11px;color:var(--text3);line-height:1.6">
          ${a?.hora_entrada_real?'Entrada '+fmtHora(a.hora_entrada_real):'Sin entrada'}${a?.hora_salida_real?' · Salida '+fmtHora(a.hora_salida_real):''}
          ${a?.monto_descuento?`<br><span style="color:var(--red);font-weight:700">Descuento del día: $${a.monto_descuento}</span>`:''}
        </div>
      </div>
      <div class="task-row" style="gap:8px;flex-wrap:wrap">
        ${sinEntrada?`<button class="tbtn done" onclick="marcarEntrada('${emp.id}')">Entrada</button>`:''}
        ${a?.hora_entrada_real&&!a.hora_salida_real?`<button class="tbtn" onclick="marcarSalida('${emp.id}')">Salida</button>`:''}
        ${puedeFaltaPermiso?`<button class="tbtn no" onclick="marcarFalta('${emp.id}')">Falta</button>`:''}
        ${puedeFaltaPermiso?`<button class="tbtn" onclick="marcarPermiso('${emp.id}')">Permiso</button>`:''}
        ${a?`<button class="tbtn" onclick="corregirAsistencia('${emp.id}')">↺ Corregir</button>`:''}
      </div>
    </div>`;
  }).join('');
}
async function marcarEntrada(empId){
  const emp=EMPLEADOS.find(e=>String(e.id)===String(empId));
  const fecha=document.getElementById('a-fecha').value||hoy();
  const horario=resolveHorario(emp);
  const ahora=new Date();
  const esperada=horaHoyDesde(horario.hora_entrada,fecha);
  const tol=horario.tolerancia_min||0;
  const diffMin=Math.round((ahora-esperada)/60000);
  const minTarde=Math.max(0,diffMin-tol);
  const dailyRate=(Number(emp.sueldo)||0)/(Number(emp.dias)||6);
  const horasJornada=horasEntre(horario.hora_entrada,horario.hora_salida);
  const tarifaHora=horasJornada?dailyRate/horasJornada:0;
  const horasDesc=Math.min(minTarde/60,horasJornada);
  const monto=Math.round(horasDesc*tarifaHora);
  try{
    await upsertAsistencia({fecha,obra:OBRA,emp_id:String(empId),emp_nombre:emp.nombre,estado:minTarde>0?'retardo':'presente',hora_entrada_real:ahora.toISOString(),hora_entrada_esperada:horario.hora_entrada,hora_salida_esperada:horario.hora_salida,minutos_tarde:minTarde,horas_descontadas:horasDesc,monto_descuento:monto,registrado_por:'encargado'});
    await syncFaltaNomina(String(empId),fecha,false);
    await renderAsistencia();
    toast(minTarde>0?`Entrada registrada — ${minTarde} min tarde`:'Entrada registrada ✓');
  }catch(e){toast(e.message,true);}
}
async function marcarSalida(empId){
  const emp=EMPLEADOS.find(e=>String(e.id)===String(empId));
  const fecha=document.getElementById('a-fecha').value||hoy();
  const horario=resolveHorario(emp);
  const ahora=new Date();
  const esperada=horaHoyDesde(horario.hora_salida,fecha);
  const tol=horario.tolerancia_min||0;
  const diffMin=Math.round((esperada-ahora)/60000);
  const minTemprano=Math.max(0,diffMin-tol);
  const dailyRate=(Number(emp.sueldo)||0)/(Number(emp.dias)||6);
  const horasJornada=horasEntre(horario.hora_entrada,horario.hora_salida);
  const tarifaHora=horasJornada?dailyRate/horasJornada:0;
  try{
    const rows=await sbGet('asistencia_diaria',`fecha=eq.${fecha}&emp_id=eq.${String(empId)}&select=*`);
    const prev=rows[0]||{};
    const horasDescTotal=Math.min((prev.horas_descontadas||0)+minTemprano/60,horasJornada);
    const montoTotal=Math.round(horasDescTotal*tarifaHora);
    await upsertAsistencia({fecha,obra:OBRA,emp_id:String(empId),emp_nombre:emp.nombre,estado:(prev.estado==='falta'||prev.estado==='permiso')?prev.estado:(horasDescTotal>0?'retardo':'presente'),hora_salida_real:ahora.toISOString(),minutos_salida_temprano:minTemprano,horas_descontadas:horasDescTotal,monto_descuento:montoTotal});
    await renderAsistencia();
    toast(minTemprano>0?`Salida registrada — ${minTemprano} min antes de su hora`:'Salida registrada ✓');
  }catch(e){toast(e.message,true);}
}
async function marcarFalta(empId){
  const emp=EMPLEADOS.find(e=>String(e.id)===String(empId));
  const fecha=document.getElementById('a-fecha').value||hoy();
  if(!confirm(`¿Marcar falta a ${emp.nombre} el ${fmtFechaCorta(fecha)}? Se descontará el día completo.`))return;
  const horario=resolveHorario(emp);
  const dailyRate=(Number(emp.sueldo)||0)/(Number(emp.dias)||6);
  const horasJornada=horasEntre(horario.hora_entrada,horario.hora_salida);
  try{
    await upsertAsistencia({fecha,obra:OBRA,emp_id:String(empId),emp_nombre:emp.nombre,estado:'falta',hora_entrada_esperada:horario.hora_entrada,hora_salida_esperada:horario.hora_salida,horas_descontadas:horasJornada,monto_descuento:Math.round(dailyRate)});
    await syncFaltaNomina(String(empId),fecha,true);
    await renderAsistencia();
    toast('Falta registrada');
  }catch(e){toast(e.message,true);}
}
async function marcarPermiso(empId){
  const emp=EMPLEADOS.find(e=>String(e.id)===String(empId));
  const fecha=document.getElementById('a-fecha').value||hoy();
  try{
    await upsertAsistencia({fecha,obra:OBRA,emp_id:String(empId),emp_nombre:emp.nombre,estado:'permiso',horas_descontadas:0,monto_descuento:0});
    await syncFaltaNomina(String(empId),fecha,false);
    await renderAsistencia();
    toast('Permiso registrado (sin descuento)');
  }catch(e){toast(e.message,true);}
}
async function corregirAsistencia(empId){
  const fecha=document.getElementById('a-fecha').value||hoy();
  if(!confirm('¿Borrar el registro de asistencia de hoy para volver a marcarlo?'))return;
  try{
    const rows=await sbGet('asistencia_diaria',`fecha=eq.${fecha}&emp_id=eq.${String(empId)}&select=id`);
    if(rows[0])await sbDel('asistencia_diaria',rows[0].id);
    await syncFaltaNomina(String(empId),fecha,false);
    await renderAsistencia();
    toast('Registro borrado');
  }catch(e){toast(e.message,true);}
}

// ══════════════════════════ TAREAS DEL DÍA ══════════════════════════
function planForDate(fecha,catExcluir){
  const dia=diaCodeDeFecha(fecha);
  return PLANTILLA.filter(p=>p.obra===OBRA&&p.activo!==false&&(catExcluir?p.categoria!==catExcluir:true)&&
    (p.frecuencia==='diaria'||(p.frecuencia==='semanal'&&p.dia_semana===dia)));
}
function renderTareas(){
  const fecha=document.getElementById('t-fecha').value||hoy();
  document.getElementById('t-fecha').value=fecha;
  const emps=empleadosObra();
  const plan=planForDate(fecha,'Rondín');
  const root=document.getElementById('tareas-root');
  if(!emps.length){root.innerHTML='<div class="empty">No hay empleados activos cargados para Elysium en Nómina.</div>';return;}

  let totalTareas=0,totalHechas=0;
  const html=emps.map(emp=>{
    const planEmp=plan.filter(p=>planMatchesEmp(p,emp));
    const registrosEmp=TAREAS.filter(r=>r.emp_id===String(emp.id)&&r.fecha===fecha);
    const filas=planEmp.map(p=>{
      const reg=registrosEmp.find(r=>r.tarea===p.tarea);
      return{tarea:p.tarea,categoria:p.categoria,reg,esAdhoc:false};
    });
    registrosEmp.filter(r=>!planEmp.some(p=>p.tarea===r.tarea)).forEach(r=>filas.push({tarea:r.tarea,categoria:r.categoria,reg:r,esAdhoc:true}));

    const hechas=filas.filter(f=>f.reg&&f.reg.estado==='hecho').length;
    totalTareas+=filas.length;totalHechas+=hechas;
    const pct=filas.length?Math.round(hechas/filas.length*100):null;
    const badgeClass=pct===null?'badge-mid':pct>=80?'badge-ok':pct>=40?'badge-mid':'badge-bad';

    const filasHtml=filas.length?filas.map(f=>{
      const estado=f.reg?.estado||'pendiente';
      const idAttr=f.reg?.id||'';
      return `<div class="task-row">
        <div style="flex:1;min-width:140px">
          <div class="task-name ${estado==='hecho'?'done':''}">${f.tarea}</div>
          <div class="task-meta">${f.categoria||''}${f.reg?.hora_registro?' · '+fmtHora(f.reg.hora_registro):''}</div>
          ${f.reg?.foto_url?`<img class="thumb" src="${f.reg.foto_url}" onclick="verFoto('${f.reg.foto_url}')"/>`:''}
        </div>
        <label class="tbtn-photo ${f.reg?.foto_url?'has':''}" title="Adjuntar foto">📷
          <input type="file" accept="image/*" capture="environment" style="display:none" onchange="marcarFoto(this,'${idAttr}','${emp.id}','${f.tarea.replace(/'/g,"\\'")}','${(f.categoria||'').replace(/'/g,"\\'")}','${fecha}')"/>
        </label>
        <button class="tbtn ${estado==='hecho'?'done':''}" onclick="marcarTarea('${idAttr}','${emp.id}','${emp.nombre.replace(/'/g,"\\'")}','${f.tarea.replace(/'/g,"\\'")}','${(f.categoria||'').replace(/'/g,"\\'")}','${fecha}','hecho')">✓ Hecho</button>
        <button class="tbtn ${estado==='no_hecho'?'no':''}" onclick="marcarTarea('${idAttr}','${emp.id}','${emp.nombre.replace(/'/g,"\\'")}','${f.tarea.replace(/'/g,"\\'")}','${(f.categoria||'').replace(/'/g,"\\'")}','${fecha}','no_hecho')">✕</button>
      </div>`;
    }).join(''):'<div class="task-row"><span style="color:var(--text3);font-size:12px">Sin tareas asignadas para hoy.</span></div>';

    return `<div class="card">
      <div class="card-hdr">
        <div class="av">${getInits(emp.nombre)}</div>
        <div><div class="card-hdr-name">${emp.nombre}</div><div class="card-hdr-sub">${emp.puesto||'—'}</div></div>
        <div class="card-hdr-sp"></div>
        <span class="badge ${badgeClass}">${pct===null?'—':pct+'%'}</span>
      </div>
      ${filasHtml}
      <div class="addrow"><a onclick="abrirModalAdhoc('${emp.id}')">+ agregar tarea</a></div>
    </div>`;
  }).join('');
  root.innerHTML=html;
  document.getElementById('t-resumen').textContent=totalTareas?`${totalHechas}/${totalTareas} completadas`:'';
}
async function marcarTarea(id,empId,empNombre,tarea,categoria,fecha,estado){
  try{
    if(id)await sbPatch('control_tareas',id,{estado,hora_registro:new Date().toISOString()});
    else await sbPost('control_tareas',{tipo:'tarea',fecha,obra:OBRA,emp_id:String(empId),emp_nombre:empNombre,tarea,categoria,estado,hora_registro:new Date().toISOString()});
    await refrescarControl();renderTareas();
  }catch(e){toast(e.message,true);}
}
async function marcarFoto(input,id,empId,tarea,categoria,fecha){
  const file=input.files[0];if(!file)return;
  try{
    const dataUrl=await compressImage(file);
    if(id)await sbPatch('control_tareas',id,{foto_url:dataUrl});
    else{
      const emp=EMPLEADOS.find(e=>String(e.id)===String(empId));
      await sbPost('control_tareas',{tipo:'tarea',fecha,obra:OBRA,emp_id:String(empId),emp_nombre:emp?.nombre||'',tarea,categoria,estado:'hecho',hora_registro:new Date().toISOString(),foto_url:dataUrl});
    }
    await refrescarControl();renderTareas();renderRondin();
    toast('Foto guardada ✓');
  }catch(e){toast('No se pudo guardar la foto: '+e.message,true);}
}
let adhocEmpId=null;
function abrirModalAdhoc(empId){
  adhocEmpId=empId;
  document.getElementById('ah-emp').innerHTML=empleadosObra().map(e=>`<option value="${e.id}"${String(e.id)===String(empId)?' selected':''}>${e.nombre}</option>`).join('');
  document.getElementById('ah-tarea').value='';
  abrirModal('modal-adhoc');
}
async function guardarAdhoc(){
  const empId=document.getElementById('ah-emp').value;
  const emp=EMPLEADOS.find(e=>String(e.id)===String(empId));
  const tarea=document.getElementById('ah-tarea').value.trim();
  const categoria=document.getElementById('ah-cat').value;
  if(!tarea)return toast('Escribe la tarea',true);
  const fecha=document.getElementById('t-fecha').value||hoy();
  try{
    await sbPost('control_tareas',{tipo:'tarea',fecha,obra:OBRA,emp_id:String(empId),emp_nombre:emp?.nombre||'',tarea,categoria,estado:'pendiente'});
    await refrescarControl();
    cerrarModal('modal-adhoc');
    renderTareas();
    toast('Tarea agregada ✓');
  }catch(e){toast(e.message,true);}
}

// ══════════════════════════ RONDÍN ══════════════════════════
// El Rondín ya NO es una lista de puntos del edificio — es Víctor recorriendo
// y verificando, empleado por empleado, si está trabajando. Cada toque agrega
// un registro nuevo con hora (no reemplaza el anterior), porque un rondín se
// hace varias veces al día. Sigue usando control_tareas (tipo='rondin'),
// sin columnas nuevas: estado 'hecho' = está trabajando, 'no_hecho' = no la
// encontré / no está en su tarea.
function renderRondin(){
  const fecha=document.getElementById('r-fecha').value||hoy();
  document.getElementById('r-fecha').value=fecha;
  if(document.getElementById('rondin-quien').style.display==='block'){
    encargadoId=document.getElementById('r-encargado-sel').value;
  }
  const enc=EMPLEADOS.find(e=>String(e.id)===String(encargadoId));
  const root=document.getElementById('rondin-root');
  if(!enc){root.innerHTML='<div class="empty">No se encontró tu registro en la nómina de Elysium.</div>';return;}

  const equipo=empleadosObra().filter(e=>String(e.id)!==String(encargadoId));
  if(!equipo.length){root.innerHTML='<div class="empty">No hay más personal activo en Elysium para verificar.</div>';return;}

  const registrosHoy=RONDINES.filter(r=>r.fecha===fecha);
  const totalChecks=registrosHoy.length;
  const conProblema=registrosHoy.some(r=>r.estado==='no_hecho');

  const filasHtml=equipo.map(emp=>{
    const checks=registrosHoy.filter(r=>String(r.emp_id)===String(emp.id))
      .sort((a,b)=>new Date(a.hora_registro)-new Date(b.hora_registro));
    const ultimo=checks[checks.length-1];
    const historial=checks.length
      ? checks.map(c=>`<span style="color:${c.estado==='hecho'?'var(--green)':'var(--red)'}">${c.estado==='hecho'?'✓':'✕'} ${fmtHora(c.hora_registro)}</span>`).join(' · ')
      : 'Sin verificar hoy';
    const fotoUlt=ultimo?.foto_url?`<img class="thumb" src="${ultimo.foto_url}" onclick="verFoto('${ultimo.foto_url}')"/>`:'';
    const nombreEsc=emp.nombre.replace(/'/g,"\\'");
    return `<div class="task-row" style="flex-wrap:wrap;align-items:flex-start">
      <div style="flex:1;min-width:160px">
        <div class="task-name">${emp.nombre}</div>
        <div class="task-meta">${emp.puesto||''}</div>
        <div class="task-meta" style="margin-top:4px">${historial}</div>
        ${fotoUlt}
      </div>
      <label class="tbtn-photo ${ultimo?.foto_url?'has':''}" title="Adjuntar foto">📷
        <input type="file" accept="image/*" capture="environment" style="display:none" onchange="marcarFotoRondin(this,'${emp.id}','${nombreEsc}','${fecha}','hecho')"/>
      </label>
      <button class="tbtn done" onclick="marcarRondin('${emp.id}','${nombreEsc}','${fecha}','hecho')">✓ Trabajando</button>
      <button class="tbtn no" onclick="marcarRondin('${emp.id}','${nombreEsc}','${fecha}','no_hecho')">✕ No la encontré</button>
      ${checks.length?`<a onclick="deshacerRondin('${checks[checks.length-1].id}')" style="font-size:10px;color:var(--text3);cursor:pointer;width:100%;text-align:right;margin-top:2px">deshacer último</a>`:''}
    </div>`;
  }).join('');

  root.innerHTML=`<div class="card">
    <div class="card-hdr">
      <div class="av">${getInits(enc.nombre)}</div>
      <div><div class="card-hdr-name">Rondín de hoy</div><div class="card-hdr-sub">${fmtFechaCorta(fecha)}</div></div>
      <div class="card-hdr-sp"></div>
      <span class="badge ${conProblema?'badge-bad':totalChecks>0?'badge-ok':'badge-mid'}">${totalChecks} verificación${totalChecks!==1?'es':''}</span>
    </div>
    ${filasHtml}
  </div>`;
}
async function marcarRondin(empId,empNombre,fecha,estado){
  try{
    await sbPost('control_tareas',{tipo:'rondin',fecha,obra:OBRA,emp_id:String(empId),emp_nombre:empNombre,tarea:'Verificación de rondín',categoria:'Rondín',estado,hora_registro:new Date().toISOString()});
    await refrescarControl();renderRondin();
    toast(estado==='hecho'?'Marcado: trabajando ✓':'Marcado: no la encontré');
  }catch(e){toast(e.message,true);}
}
async function marcarFotoRondin(input,empId,empNombre,fecha,estado){
  const file=input.files[0];if(!file)return;
  try{
    const dataUrl=await compressImage(file);
    await sbPost('control_tareas',{tipo:'rondin',fecha,obra:OBRA,emp_id:String(empId),emp_nombre:empNombre,tarea:'Verificación de rondín',categoria:'Rondín',estado,hora_registro:new Date().toISOString(),foto_url:dataUrl});
    await refrescarControl();renderRondin();toast('Foto guardada ✓');
  }catch(e){toast('No se pudo guardar la foto: '+e.message,true);}
}
async function deshacerRondin(id){
  if(!confirm('¿Borrar esta verificación de rondín?'))return;
  try{
    await sbDel('control_tareas',id);
    await refrescarControl();renderRondin();
    toast('Verificación borrada');
  }catch(e){toast(e.message,true);}
}

// ══════════════════════════ INCIDENCIAS ══════════════════════════
function renderIncidencias(){
  const filtro=document.getElementById('i-filtro').value;
  let lista=[...INCIDENCIAS].sort((a,b)=>new Date(b.creado_en)-new Date(a.creado_en));
  if(filtro==='abiertas')lista=lista.filter(i=>!i.resuelto);
  if(filtro==='resueltas')lista=lista.filter(i=>i.resuelto);
  const root=document.getElementById('incidencias-root');
  if(!lista.length){root.innerHTML='<div class="empty">Sin incidencias registradas.</div>';return;}
  root.innerHTML=lista.map(i=>`
    <div class="inc-item">
      <div class="inc-top">
        <div class="sevdot ${i.severidad||'leve'}"></div>
        <div style="flex:1">
          <div class="inc-title">${i.tarea}</div>
          <div class="inc-meta">${i.emp_nombre?i.emp_nombre+' · ':''}${i.categoria||''} · ${fmtFechaCorta(i.fecha)}</div>
          ${i.notas?`<div class="inc-notes">${i.notas}</div>`:''}
          ${i.foto_url?`<img class="thumb" src="${i.foto_url}" onclick="verFoto('${i.foto_url}')"/>`:''}
        </div>
        <span class="badge ${i.resuelto?'badge-ok':'badge-bad'}">${i.resuelto?'Resuelta':'Abierta'}</span>
      </div>
      ${!i.resuelto?`<button class="tbtn" style="margin-top:8px" onclick="resolverIncidencia('${i.id}')">Marcar resuelta</button>`:''}
    </div>`).join('');
}
async function resolverIncidencia(id){
  try{await sbPatch('control_tareas',id,{resuelto:true,resuelto_en:new Date().toISOString(),estado:'hecho'});await refrescarControl();renderIncidencias();toast('Marcada como resuelta ✓');}
  catch(e){toast(e.message,true);}
}
function abrirModalIncidencia(){
  document.getElementById('inc-emp').innerHTML='<option value="">— N/A —</option>'+empleadosObra().map(e=>`<option value="${e.id}" data-nombre="${e.nombre}">${e.nombre}</option>`).join('');
  document.getElementById('inc-titulo').value='';document.getElementById('inc-notas').value='';document.getElementById('inc-foto').value='';
  abrirModal('modal-incidencia');
}
async function guardarIncidencia(){
  const titulo=document.getElementById('inc-titulo').value.trim();
  if(!titulo)return toast('Escribe qué pasó',true);
  const empSel=document.getElementById('inc-emp');
  const empId=empSel.value;
  const empNombre=empId?empSel.selectedOptions[0].dataset.nombre:'';
  const categoria=document.getElementById('inc-cat').value;
  const severidad=document.getElementById('inc-sev').value;
  const notas=document.getElementById('inc-notas').value.trim();
  const file=document.getElementById('inc-foto').files[0];
  try{
    let foto_url=null;
    if(file)foto_url=await compressImage(file);
    await sbPost('control_tareas',{tipo:'incidencia',fecha:hoy(),obra:OBRA,emp_id:empId||null,emp_nombre:empNombre,tarea:titulo,categoria,severidad,detectado_por:'Encargado',notas:notas||null,foto_url,estado:'pendiente',resuelto:false});
    await refrescarControl();
    cerrarModal('modal-incidencia');
    renderIncidencias();
    toast('Guardado ✓');
  }catch(e){toast(e.message,true);}
}

// ══════════════════════════ INIT ══════════════════════════
async function refrescarControl(){splitControl(await loadControlTareas());}
async function init(){
  document.getElementById('a-fecha').value=hoy();
  document.getElementById('t-fecha').value=hoy();
  document.getElementById('r-fecha').value=hoy();
  try{
    const[emps,plantilla,control,horarios]=await Promise.all([loadEmpleados(),loadPlantilla(),loadControlTareas(),loadHorarios()]);
    EMPLEADOS=emps;PLANTILLA=plantilla;splitControl(control);HORARIOS=horarios;
    detectarEncargado();
    renderAsistencia();renderTareas();renderRondin();renderIncidencias();
  }catch(e){toast('Error al cargar: '+e.message,true);}
  finally{document.getElementById('loading-scr').style.display='none';}
}
window.addEventListener('load',init);
</script>
